name: hier_config build and test

on:
  push:
    branches: [master, next]
  pull_request:
    branches: [master, next]

# Superseded runs on the same branch are pointless spend. Pushes to master still
# run to completion so every commit on the default branch has a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Single source of truth for the MSRV declared in Cargo.toml's `rust-version`.
  # The crates are edition 2024, which already requires rustc >= 1.85.
  MSRV: 1.98.1
  # Lint toolchain, pinned deliberately. Gating fmt/clippy/doc on a floating
  # `stable` would let a newly-added upstream lint turn CI red without a change
  # on our side, so this is bumped as an explicit, reviewable commit.
  LINT_TOOLCHAIN: 1.98.1
  PYTHON_DEFAULT: "3.12"

jobs:
  rust-msrv:
    # Proves the `rust-version` promise in Cargo.toml still holds.
    #
    # This is `check`, not `test`, on purpose: dev-dependencies are not bound by
    # our MSRV and are invisible to downstream consumers, so they cannot break
    # the promise this job guards. Building the test harness here would assert
    # something we never promised. `--all-features` and `--workspace` still
    # cover every line a consumer can compile.
    #
    # MSRV currently equals the pinned stable toolchain, which makes this job
    # look redundant today. It is not: it is the mechanism that keeps
    # `rust-version` honest, and it regains distinct coverage the moment stable
    # moves ahead of the declared floor.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ env.MSRV }}
    - uses: Swatinem/rust-cache@v2
      with:
        key: msrv
    - name: Check the library builds on the declared MSRV
      run: cargo check --locked --workspace --all-features

  rust-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ env.LINT_TOOLCHAIN }}
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
      with:
        key: lint
    - name: Cargo fmt check
      run: cargo fmt --check
    - name: Cargo clippy
      # Clippy warnings are errors here, so lint failures block the PR.
      # `--all-targets` also lints test and benchmark code, which is where most
      # sloppiness accumulates.
      run: cargo clippy --locked --all-targets --all-features -- -D warnings
    - name: Cargo doc
      # Broken intra-doc links and malformed doc comments are invisible to both
      # clippy and the test suite. `--no-deps` keeps this to our own crates.
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --locked --no-deps --workspace --all-features

  rust-tests:
    # deploy-pypi.yml ships wheels for Linux, Windows and macOS, so all three are
    # compiled and tested here. Without them a platform-specific break (mimalloc
    # bundles a C allocator, so it is the likely culprit) would surface at
    # release time instead of on the PR.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v6
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.os }}
    - name: Run Cargo tests
      # `--locked` fails the build if Cargo.lock is stale rather than silently
      # resolving new versions, so a Cargo.toml edit without a matching lockfile
      # update cannot reach master.
      #
      # No `--all-targets`: it would silently drop doctests, which are the only
      # check that the examples in our public API docs still compile.
      run: cargo test --locked --workspace --all-features

  rust-coverage:
    # Measures line coverage for `crates/hier_config_core` and enforces a strict floor.
    # The floor is ratcheted upward as test suites migrate to native Rust.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview
    - uses: Swatinem/rust-cache@v2
      with:
        key: rust-cov
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov
    - name: Measure Rust core coverage and enforce floor
      run: cargo llvm-cov --locked --package hier_config_core --fail-under-lines 47

  cargo-deny:
    # Supply-chain policy: RustSec advisories, licence allow-list, banned and
    # duplicated crates, and registry provenance. Configured by deny.toml, which
    # is the single source of truth -- this replaced a standalone `cargo audit`
    # job so the advisory ignore-list lives in exactly one place. Advisories land
    # independently of our commits, so this reports drift rather than staying
    # silent until someone remembers to check.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Check advisories, licences, bans and sources
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check


  python-lint:
    # `scripts/build.py` is the source of truth for these commands; keep them in
    # sync. The extension must be built first: mypy and pyright resolve
    # `_hier_config_rust` through `stubs/_hier_config_rust.pyi`, which only
    # type-checks against an installed module.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_DEFAULT }}
    - name: Set up virtual environment
      run: |
        python -m venv .venv
        echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
        echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ env.MSRV }}
    - uses: Swatinem/rust-cache@v2
    - name: Install tooling
      run: |
        python -m pip install --upgrade pip
        pip install --group dev
        maturin develop --release --locked
    - name: Ruff format
      run: ruff format --check hier_config tests scripts
    - name: Ruff lint
      run: ruff check --output-format=concise hier_config tests scripts
    - name: Mypy
      run: mypy hier_config tests scripts
    - name: Pyright
      run: pyright hier_config tests scripts
    - name: Pylint
      run: pylint hier_config tests scripts
    - name: Flynt
      run: flynt -d -tc -f hier_config tests scripts
    - name: Yamllint
      run: yamllint .
    - name: Check displacement markers
      run: python scripts/check_displacement_markers.py

  python-tests:
    runs-on: ubuntu-latest
    needs: [rust-tests]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up virtual environment
      run: |
        python -m venv .venv
        echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
        echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ env.MSRV }}
    - uses: Swatinem/rust-cache@v2
    - name: Install maturin and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin pytest pytest-cov
        # Deliberately does NOT hand-install pydantic/pyyaml. `maturin develop`
        # resolves `[project.dependencies]`, so an undeclared runtime dependency
        # fails here instead of after release.
        maturin develop --release --locked
    - name: Run tests
      run: pytest tests/
    - name: Run tests with coverage
      # Coverage is measured once rather than per interpreter: the floor covers
      # the Python API surface, which is not version-gated, so running it five
      # times only buys duplicate work.
      if: matrix.python-version == env.PYTHON_DEFAULT
      run: pytest tests/ --cov=hier_config --cov-fail-under=88 --cov-report=term-missing

  packaging:
    # Regression guard for the defect class where library code imports a package
    # that is never declared in `[project.dependencies]`. Every other job builds
    # in-tree, so only a real wheel in a clean environment can catch it. Note the
    # absence of `--no-index`: resolving `Requires-Dist` from PyPI is the point.
    runs-on: ubuntu-latest
    needs: [rust-tests]
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_DEFAULT }}
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ env.MSRV }}
    - uses: Swatinem/rust-cache@v2
    - name: Build wheel
      run: |
        python -m pip install --upgrade pip
        pip install maturin
        maturin build --release --locked --out dist
    - name: Install the wheel into a clean environment
      run: |
        python -m venv /tmp/wheel-env
        /tmp/wheel-env/bin/pip install --upgrade pip
        /tmp/wheel-env/bin/pip install dist/*.whl
    - name: Every public module must import with only declared dependencies
      run: /tmp/wheel-env/bin/python scripts/check_declared_dependencies.py

  performance-gate:
    # Guards against silent performance regressions. Divides each operation by a
    # pure-Python calibration workload timed on the same machine in the same
    # run, so the result is a ratio and does not depend on how fast the runner
    # is.
    runs-on: ubuntu-latest
    needs: [rust-tests]
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_DEFAULT }}
    - name: Set up virtual environment
      run: |
        python -m venv .venv
        echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
        echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ env.MSRV }}
    - uses: Swatinem/rust-cache@v2
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin pytest
        maturin develop --release --locked
    - name: Run performance regression gate
      run: pytest -m benchmark tests/benchmarks/test_perf_regression.py -v -s

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_DEFAULT }}
    - name: Install docs dependencies
      run: pip install -r docs/requirements.txt
    - name: Build docs
      run: mkdocs build --strict
