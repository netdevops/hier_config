name: hier_config build and test

on:
  push:
    branches: [master, next]
  pull_request:
    branches: [master, next]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
    steps:
    - uses: actions/checkout@v6
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Run tests
      # Pin every uv invocation to the matrix interpreter; without UV_PYTHON,
      # uv resolves an interpreter by discovery and the matrix leg may not test
      # the Python version it claims to.
      env:
        UV_PYTHON: ${{ matrix.python-version }}
        # `uv run` re-locks and re-syncs by default; keep it frozen so a stale
        # lockfile fails the job instead of being silently rewritten.
        UV_FROZEN: "1"
      run: |
        uv sync --frozen --no-install-project
        uv run python scripts/build.py lint
        uv run python scripts/build.py pytest --coverage
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install docs dependencies
      run: pip install -r docs/requirements.txt
    - name: Build docs
      run: mkdocs build --strict
