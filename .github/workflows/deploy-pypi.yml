name: deploy to pypi

# "published" (not "created") so publishing a draft release made by the
# prepare-release workflow also triggers deployment.
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Install poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.5.1
    - name: Build and publish to PyPI
      env:
        TWINE_API_KEY: ${{ secrets.TWINE_API_KEY }}
      run: |
        poetry config pypi-token.pypi $TWINE_API_KEY
        poetry publish --build
