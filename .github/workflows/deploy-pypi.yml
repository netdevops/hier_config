name: deploy to pypi

# "published" (not "created") so publishing a draft release made by the
# prepare-release workflow also triggers deployment.
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Build and publish to PyPI
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.TWINE_API_KEY }}
      run: |
        uv build
        uv publish
