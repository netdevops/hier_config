flow exporter-map EXPORTER1
 version v9
  options interface-table timeout 300
  options sampler-table timeout 300
  template data timeout 15
  template options timeout 15
 !
 transport udp 9999
!
interface Loopback0
 ipv4 address 10.0.0.1 255.255.255.255
!
router bgp 65000
 neighbor 10.0.0.3
  remote-as 65001
