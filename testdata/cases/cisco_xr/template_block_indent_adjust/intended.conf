template ACCESS-PORT
 description Access Port - Standard Config
 load-interval 30
 ipv4 mtu 1500
 mtu 1518
 dampening
 carrier-delay up 5000 down 0
 spanning-tree portfast
!
template UPLINK-PORT
 description Uplink - Core Facing
 load-interval 30
 mtu 9216
 ipv4 mtu 9000
 dampening
 carrier-delay up 5000 down 0
 lldp
  transmit
  receive
 !
!
